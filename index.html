
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quizzy - Test your knowledge with interactive quizzes.">
    <title>Quizzy | JavaScript Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <a href="#" class="logo">Quizzy<span>.</span></a>
        <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">🌙</button>
    </header>

    <main class="app-container">
        <section class="welcome-screen" id="welcomeScreen">
            <span class="eyebrow">THE KNOWLEDGE CHALLENGE</span>
            <h1>Test Your <span>Knowledge.</span></h1>
            <p>Challenge yourself with 10 questions and see how much you know.</p>
            <button class="primary-btn" id="startBtn">Start Quiz <span>→</span></button>
            <p class="quiz-info">10 Questions <span>•</span> Multiple Choice <span>•</span> Instant Results</p>
        </section>

        <section class="quiz-container hidden" id="quizScreen">
            <div class="quiz-header">
                <span id="questionCounter">Question 1 of 10</span>
                <span id="scoreDisplay">Score: 0</span>
            </div>

            <div class="progress-track">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <h2 id="questionText"></h2>

            <div class="options-container" id="optionsContainer"></div>

            <div class="feedback" id="feedback" aria-live="polite"></div>

            <div class="quiz-navigation">
                <button class="secondary-btn" id="previousBtn" disabled>Previous</button>
                <button class="primary-btn" id="nextBtn">Next Question →</button>
            </div>
        </section>

        <section class="result-container hidden" id="resultScreen">
            <h1>Quiz Completed!</h1>
            <p>Your results will appear here.</p>
        </section>
    </main>

    <footer>
        <p>Made with focus and curiosity. © 2026 Quizzy</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
